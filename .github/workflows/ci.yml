name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Upstream ikabot ref (tag or commit) the tests import from. Keep it in step with the
  # image pinned in docker-compose.yml when that image is promoted. The image tagged
  # v7.7.3 is built from master 3ea1e0e; upstream has no v7.7.3 tag.
  IKABOT_REF: 3ea1e0eebfb2e52b5f53ea8b5051df2a9a887579

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Fetch upstream ikabot
        run: |
          git init -q ikabot
          git -C ikabot fetch -q --depth 1 https://github.com/Ikabot-Collective/ikabot.git "$IKABOT_REF"
          git -C ikabot checkout -q FETCH_HEAD

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Pyflakes (undefined names)
        run: .github/scripts/pyflakes_undefined.sh

      - name: Pytest
        run: python -m pytest tests/ -q

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Type check and build
        run: npm run build
