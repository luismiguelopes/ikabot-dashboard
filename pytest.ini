[pytest]
# The real ikabot package lives at ./ikabot/ikabot, and our custom modules
# (transport_manager, farm_manager, …) sit at the repo root. Put both on sys.path
# explicitly so `import ikabot.config` and `import transport_manager` resolve without
# a manual PYTHONPATH — the documented command `.venv/bin/python -m pytest tests/ -q`
# then works on its own (B9).
pythonpath = . ikabot
testpaths = tests
