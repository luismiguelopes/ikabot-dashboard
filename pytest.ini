[pytest]
# The real ikabot package lives at ./ikabot/ikabot, and our custom modules
# (transport_manager, farm_manager, …) sit in ./bot. Put them on sys.path explicitly
# so `import ikabot.config` and `import transport_manager` resolve without a manual
# PYTHONPATH — the documented command `.venv/bin/python -m pytest tests/ -q` then works
# on its own (B9). `.` stays for repo-root helpers (e.g. ikabot_gui imports in tests).
pythonpath = . bot ikabot
testpaths = tests
