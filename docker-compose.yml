
services:
  ikabot:
    # STABLE channel — pinned to a validated digest (ikabot 7.6.1).
    # Our anti-detection tweaks are injected surgically at runtime by bot_launcher
    # (see planroutes_overrides.py / loadcustommodule_overrides.py), so additive
    # upstream changes no longer break us. Promotion flow: test :latest as "beta"
    # (diff stock files, re-run the offline import check, one live boot), then pin
    # its digest here as the next stable.
    # 7.6.1 note: the login flow now caches sessions in ~/.ikabot and skips the
    # password prompt when cookies exist; bot_launcher drains predetermined_input
    # after Session() so no leftover misfires the menu.
    # Previous stable: 7.6.0 @sha256:a5aad9ba0911d672786a9b53f45e1a2a6112395ff55ddf757f9adbf9d05f7651
    image: ghcr.io/luismiguelopes/ikabot@sha256:9efc25bbd0bc3e2500f2455e04e00bfefbf0cb69fc8444ece049de9acc1fc923
    container_name: ikabot
    restart: unless-stopped
    stdin_open: true
    tty: true
    environment:
      TZ: Europe/Lisbon
      # P6.6: single source for "bot offline" (healthcheck + Telegram watchdog + sidebar)
      BOT_OFFLINE_SECS: ${BOT_OFFLINE_SECS:-1800}
    env_file:
      - .env
    volumes:
      # Deterministic entrypoint — spawns empireFunction by reference, then menu
      - ./bot_launcher.py:/ikabot/bot_launcher.py
      # Main loop — thin orchestrator
      - ./empireFunction.py:/ikabot/ikabot/function/empireFunction.py
      # Módulos de suporte injectados na mesma pasta para importação relativa
      - ./empire_utils.py:/ikabot/ikabot/function/empire_utils.py
      - ./empire_collector.py:/ikabot/ikabot/function/empire_collector.py
      - ./costs_collector.py:/ikabot/ikabot/function/costs_collector.py
      - ./scan_collector.py:/ikabot/ikabot/function/scan_collector.py
      - ./queue_processor.py:/ikabot/ikabot/function/queue_processor.py
      - ./db_manager.py:/ikabot/ikabot/function/db_manager.py
      - ./telegram_notifier.py:/ikabot/ikabot/function/telegram_notifier.py
      - ./espionage_manager.py:/ikabot/ikabot/function/espionage_manager.py
      - ./espionage_parsers.py:/ikabot/ikabot/function/espionage_parsers.py
      - ./attack_manager.py:/ikabot/ikabot/function/attack_manager.py
      - ./transport_manager.py:/ikabot/ikabot/function/transport_manager.py
      - ./farm_manager.py:/ikabot/ikabot/function/farm_manager.py
      # Surgical overrides — bot_launcher execs these INTO the live stock modules
      # (planRoutes: human delays; loadCustomModule: Add/Remove menu) instead of
      # shadowing whole stock files, so upstream additions can't break our imports.
      - ./planroutes_overrides.py:/ikabot/planroutes_overrides.py
      - ./loadcustommodule_overrides.py:/ikabot/loadcustommodule_overrides.py
      # Pasta Virtual Partilhada
      - ikalogs_volume:/tmp/ikalogs/
      # Sessão persistente: ~/.ikabot guarda os cookies de login (7.6.1). Num volume,
      # sobrevive a recreate/promoção de imagem → o bot reutiliza a sessão em vez de fazer
      # login fresco (que depende do serviço externo do blackbox token). Menos logins no
      # jogo (anti-detecção) e deploys deixam de arriscar um login preso.
      - ikabot_home:/root/.ikabot
      # Backups diários do SQLite para fora do volume (P6.3) — sobrevive a docker volume rm
      - ./backups:/backups
    # Deterministic startup: bot_launcher spawns empireFunction by reference and
    # then hands PID 1 the normal interactive menu (docker attach still works).
    # No hardcoded menu indices -> an upstream :latest menu reorder can't break it.
    command: >
      python3 /ikabot/bot_launcher.py ${IKABOT_EMAIL} ${IKABOT_PASSWORD}
    ports:
      - "43357:43357"
      - "43573:43573"
    # Self-healing: the worker writes last_alive.json every ≤60s (smart_sleep). If it goes
    # stale > 30 min the container is unhealthy and the autoheal sidecar restarts it — covers
    # the case where the spy/empire worker dies (sys.exit) while the ikabot parent PID 1
    # survives, which restart:unless-stopped alone would NOT recover.
    labels:
      - autoheal=true
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import json,time,sys,os; sys.exit(0 if time.time()-json.load(open('/tmp/ikalogs/last_alive.json'))['lastAlive'] < int(os.environ.get('BOT_OFFLINE_SECS','1800')) else 1)\""]
      interval: 2m
      timeout: 20s
      retries: 3
      start_period: 15m

  # Watchdog: restarts any container marked unhealthy that carries the label autoheal=true.
  autoheal:
    image: willfarrell/autoheal
    container_name: ikabot-autoheal
    restart: unless-stopped
    environment:
      TZ: Europe/Lisbon
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: 60
      AUTOHEAL_START_PERIOD: 300
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  ikabot-gui:
    image: python:3.12-slim
    container_name: ikabot-gui
    restart: unless-stopped
    environment:
      TZ: Europe/Lisbon
      BOT_OFFLINE_SECS: ${BOT_OFFLINE_SECS:-1800}
    env_file:
      - .env
    volumes:
      # Pega na pasta inteira ./ikabot_gui que está ao lado do compose e mete no contentor
      - ./ikabot_gui:/gui
      - ./db_manager.py:/gui/db_manager.py
      - ./telegram_notifier.py:/gui/telegram_notifier.py
      # P6.11: build de produção do frontend, servido pelo Flask (era um container Vite)
      # Rebuild após mudanças no frontend: cd frontend && npx vite build
      - ./frontend/dist:/gui/dist:ro
      # A mesma Pasta Virtual Partilhada
      - ikalogs_volume:/tmp/ikalogs/
    working_dir: /gui
    ports:
      - "5001:5000"
    command: >
      bash -c "pip install 'flask==3.1.*' && python app.py"

volumes:
  ikalogs_volume:
  ikabot_home:    # sessão/cookies do ikabot (~/.ikabot), persistente entre recreations
